<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Web制作サービス</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ヒーロー -->
  <header class="hero">
    <h1>あなたのビジネスを加速するWeb制作</h1>
    <p>LP制作・サイト制作をスピーディーに対応します</p>
    <button id="scrollBtn">無料相談はこちら</button>
  </header>

  <!-- 実績・強み -->
  <section class="features">
    <h2>Features</h2>

    <div class="grid">
      <div class="box">最短3日納品</div>
      <div class="box">レスポンシブ対応</div>
      <div class="box">修正対応あり</div>
    </div>
  </section>

  <!-- サービス内容 -->
  <section class="service">
    <h2>Service</h2>

    <div class="card">
      <h3>LP制作</h3>
      <p>集客・広告用のランディングページを制作</p>
    </div>

    <div class="card">
      <h3>コーポレートサイト</h3>
      <p>企業向けのシンプルなWebサイト制作</p>
    </div>

    <div class="card">
      <h3>修正・改善</h3>
      <p>既存サイトの改善・リニューアル</p>
    </div>
  </section>

  <!-- 料金 -->
  <section class="price">
    <h2>Price</h2>

    <div class="price-card">
      <h3>LP制作</h3>
      <p>50,000円〜</p>
    </div>
  </section>

  <!-- CTA -->
  <section class="cta">
    <h2>まずはご相談ください</h2>
    <p>無料でヒアリングいたします</p>
    <button>お問い合わせ</button>
  </section>

  <!-- フッター -->
  <footer>
    <p>© Web Production</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
