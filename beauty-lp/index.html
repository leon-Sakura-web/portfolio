<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Beauty Salon</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HERO -->
  <header class="hero">
    <h1>Beauty Salon</h1>
    <p>あなたの“なりたい”を叶えるサロン</p>
    <button id="scrollBtn">無料カウンセリング予約</button>
  </header>

  <!-- ABOUT（信頼強化） -->
  <section class="about">
    <h2>About</h2>
    <p>
      丁寧なカウンセリングと高い技術で、
      一人ひとりに合わせたスタイルをご提案します。<br>
      髪質改善・カラー・カットまでトータルでサポート。
    </p>
  </section>

  <!-- STYLE（実績化） -->
  <section class="style">
    <h2>Style</h2>
    <p>施術事例・スタイルギャラリー</p>

<div class="gallery">
  <img src="img/style1.jpg" alt="ヘアスタイル1">
  <img src="img/style2.jpg" alt="ヘアスタイル2">
  <img src="img/style3.jpg" alt="ヘアスタイル3">
</div>

  <!-- MENU（実務化） -->
  <section class="menu">
    <h2>Menu</h2>

    <ul class="menu-list">
      <li>
        <span>カット</span>
        <span>¥4,000（シャンプー込）</span>
      </li>
      <li>
        <span>カラー</span>
        <span>¥6,500（ケア込み）</span>
      </li>
      <li>
        <span>トリートメント</span>
        <span>¥3,000（髪質改善）</span>
      </li>
    </ul>
  </section>

  <!-- ACCESS（追加・実在感） -->
  <section class="access">
    <h2>Access</h2>
    <p>
      東京都杉並区（仮）<br>
      XX駅 徒歩5分
    </p>
  </section>

  <!-- CONTACT（CTA強化） -->
  <section class="contact">
    <h2>Reservation</h2>
    <p>初回カウンセリングは無料です</p>
    <button>予約フォームへ</button>
  </section>

  <footer>
    <p>© Beauty Salon</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
