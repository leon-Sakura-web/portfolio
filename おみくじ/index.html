<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>JS練習</title>
</head>
<body>

  <h1 id="result">おみくじ</h1>

  <button onclick="omikuji()">
    引く
  </button>

  <script>

    function omikuji() {

      let number = Math.floor(Math.random() * 3);

      if (number == 0) {

        document.getElementById("result").textContent =
          "大吉";

      } else if (number == 1) {

        document.getElementById("result").textContent =
          "中吉";

      } else {

        document.getElementById("result").textContent =
          "凶";

      }

    }

  </script>

</body>
</html>
