<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>COFFEE CAFE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="hero">
  <div class="hero-overlay">
    <h1>COFFEE CAFE</h1>
    <p>最高の一杯を、あなたに。</p>
    <button id="scrollBtn">メニューを見る</button>
  </div>
</header>
  <!-- ABOUT -->
  <section class="about">
    <h2>About</h2>
    <p>
      こだわりの豆と丁寧なハンドドリップで、<br>
      毎日飲みたくなるコーヒーを提供しています。
    </p>
  </section>

  <!-- MENU -->
  <section class="menu">
    <h2>Menu</h2>

    <div class="cards">

      <div class="card">
        <img src="img/latte1.jpg" alt="latte">
        <p>カフェラテ</p>
      </div>

      <div class="card">
        <img src="img/espresso1.jpg" alt="espresso">
        <p>エスプレッソ</p>
      </div>

      <div class="card">
        <img src="img/coffee1.jpg" alt="coffee">
        <p>ブレンドコーヒー</p>
      </div>

      <div class="card">
        <img src="img/americano1.jpg" alt="americano">
        <p>アメリカーノ</p>
      </div>

    </div>
  </section>

  <!-- ACCESS -->
  <section class="access">
    <h2>Access</h2>

    <div class="info-box">
      <p>📍 XX区 XX（架空住所）</p>
      <p>🚉 XX駅 徒歩5分</p>
      <p>🕒 10:00 - 20:00</p>
    </div>
  </section>

  <!-- CONTACT -->
  <section class="contact">
    <h2>Contact</h2>
    <p>お気軽にお問い合わせください</p>
    <button>予約・問い合わせ</button>
  </section>

  <footer>
    <p>© COFFEE CAFE</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
